# Cloudflare: build with `npm run build`, deploy with `npx wrangler deploy` (if dashboard asks for a deploy command).
# Local preview: npm run build && npx wrangler pages dev dist
name = "mercerline"
compatibility_date = "2025-01-01"
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
