# Optional: deploy frontend via GitHub Actions instead of Cloudflare's Git integration.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# SUPABASE_URL, SUPABASE_ANON_KEY, API_BASE_URL (and optional VITE_BILLING_GATE).
# If you use Cloudflare Pages "Connect to Git", leave this workflow disabled or delete it.
name: Deploy frontend (Cloudflare Pages)

on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          VITE_BILLING_GATE: ${{ secrets.VITE_BILLING_GATE }}
          REFERRAL_ATTRIBUTION_DAYS: ${{ secrets.REFERRAL_ATTRIBUTION_DAYS }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mercerline
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
